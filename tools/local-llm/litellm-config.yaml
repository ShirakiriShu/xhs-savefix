model_list:
  - model_name: glm-5.1                       # 脚本默认 MODEL 名,零改动的关键
    litellm_params:
      model: ollama/qwen3.8:27b-mlx
      api_base: http://127.0.0.1:11434
  - model_name: ollama/qwen3.8:27b-mlx         # 直呼本名也可
    litellm_params:
      model: ollama/qwen3.8:27b-mlx
      api_base: http://127.0.0.1:11434

litellm_settings:
  drop_params: true          # anthropic-version 等多余参数丢弃
  num_retries: 1
  request_timeout: 600       # 27B 速度慢,超时给足

general_settings:
  master_key: sk-local-claude-code-gateway   # 与脚本默认 KEY 一致
